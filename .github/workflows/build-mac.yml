name: Build Mac app

on:
  push:
    branches: [claude/youtube-instagram-script-scraper-4myj0a, main]
    paths: ["scraper/**", ".github/workflows/build-mac.yml"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-mac
  cancel-in-progress: true

env:
  GH_TOKEN: ${{ github.token }}
  RELEASE_TAG: latest

jobs:
  build:
    runs-on: macos-14   # Apple Silicon (M1~M4) 맥용
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r scraper/requirements.txt pyinstaller

      - name: Download deno (yt-dlp needs a JS runtime for YouTube)
        run: |
          mkdir -p scraper/vendor
          curl -fsSL https://github.com/denoland/deno/releases/latest/download/deno-aarch64-apple-darwin.zip -o deno.zip
          unzip -o deno.zip -d scraper/vendor
          chmod +x scraper/vendor/deno
          scraper/vendor/deno --version

      - name: Build app
        run: |
          pyinstaller --noconfirm --clean --windowed --name ScriptGrabber \
            --osx-bundle-identifier com.blgdtap.scriptgrabber \
            --add-data "scraper/index.html:." \
            --add-binary "scraper/vendor/deno:." \
            --collect-all faster_whisper --collect-all ctranslate2 --collect-all onnxruntime \
            --collect-all yt_dlp --collect-all yt_dlp_ejs \
            scraper/app.py
          # 맥의 앱 이름을 한글로 표시
          plutil -replace CFBundleDisplayName -string "대본 추출기" dist/ScriptGrabber.app/Contents/Info.plist
          plutil -replace CFBundleName -string "대본 추출기" dist/ScriptGrabber.app/Contents/Info.plist
          codesign --force --deep --sign - dist/ScriptGrabber.app

      - name: Self test (imports, deno)
        run: dist/ScriptGrabber.app/Contents/MacOS/ScriptGrabber --selftest

      - name: Self test (Whisper)
        timeout-minutes: 6
        continue-on-error: true
        run: dist/ScriptGrabber.app/Contents/MacOS/ScriptGrabber --selftest-whisper

      - name: Launch smoke test (non-fatal)
        continue-on-error: true
        run: |
          dist/ScriptGrabber.app/Contents/MacOS/ScriptGrabber > launch.log 2>&1 &
          PID=$!
          sleep 10
          if kill -0 $PID 2>/dev/null; then echo "app is running"; kill $PID; else echo "app exited early"; cat launch.log; exit 1; fi

      - name: Zip
        run: ditto -c -k --sequesterRsrc --keepParent dist/ScriptGrabber.app ScriptGrabber-mac.zip

      - name: Publish to release
        run: |
          gh release view "$RELEASE_TAG" >/dev/null 2>&1 || gh release create "$RELEASE_TAG" \
            --title "대본 추출기 (최신 버전)" \
            --notes "맥(Apple Silicon)용 대본 추출기. ScriptGrabber-mac.zip 을 받아 압축을 풀고 실행하세요." \
            --target "$GITHUB_SHA"
          gh release upload "$RELEASE_TAG" ScriptGrabber-mac.zip --clobber
