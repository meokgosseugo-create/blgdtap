<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>찰떡 — 세상 모든 꿀조합</title>
  <style>
:root {
  color-scheme: light;
  --bg: #ffffff;
  --card: #ffffff;
  --ink: #17141f;
  --muted: #6f6a7a;
  --line: rgba(23, 20, 31, .09);
  --brand: #ff5a2e;
  --brand-a: #ff6a3d;
  --brand-b: #ffb02e;
  --brand-ink: #2a1204;
  --grad: linear-gradient(135deg, var(--brand-a), var(--brand-b));
  --mesh1: rgba(255, 176, 46, .28);
  --mesh2: rgba(150, 120, 255, .20);
  --good: #1f9d63;
  --shadow: 0 10px 30px rgba(60, 30, 80, .08);
  --radius: 20px;
}

* { box-sizing: border-box; }

html, body { margin: 0; padding: 0; }

body {
  min-height: 100vh;
  background: var(--bg);
  color: var(--ink);
  font-family: "Pretendard", -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Noto Sans KR", "Malgun Gothic", system-ui, sans-serif;
  line-height: 1.5;
  -webkit-text-size-adjust: 100%;
}

#app {
  max-width: 480px;
  margin: 0 auto;
  padding: 20px 16px 56px;
}

button { font: inherit; color: inherit; cursor: pointer; }

/* 상단 */
.top { display: flex; align-items: center; justify-content: space-between; margin-bottom: 20px; }
.brand { display: flex; align-items: baseline; gap: 8px; }
.logo {
  font-size: 30px; font-weight: 900; letter-spacing: -0.04em;
  background: var(--grad); -webkit-background-clip: text; background-clip: text; color: transparent;
}
.sub { font-size: 13px; color: var(--muted); }
.dex {
  font-size: 12px; font-weight: 600; padding: 6px 12px; border-radius: 999px;
  background: var(--card); border: 1px solid var(--line); color: var(--muted); box-shadow: var(--shadow);
}

/* 트레이 (고른 재료) */
.tray { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin-bottom: 24px; }
.slot {
  position: relative; min-height: 84px; padding: 10px 4px 8px; border-radius: 18px;
  border: 1.5px dashed var(--line); background: transparent; color: var(--muted);
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px;
  text-align: center; font-size: 12px; line-height: 1.25; word-break: keep-all;
}
.slot .num { font-size: 11px; font-weight: 700; opacity: .6; }
.slot.filled {
  border: 1.5px solid transparent; color: var(--ink); font-weight: 700;
  background: linear-gradient(var(--card), var(--card)) padding-box, var(--grad) border-box;
  box-shadow: var(--shadow); animation: pop .25s ease-out;
  transition: transform .1s ease;
}
.slot.filled:hover { transform: translateY(-2px); }
.slot.filled:active { transform: scale(.96); }
.slot .emoji { font-size: 28px; line-height: 1.1; }
.slot .sname { font-size: 11px; font-weight: 700; }
.slot .x {
  position: absolute; top: -7px; right: -5px; width: 20px; height: 20px; border-radius: 50%;
  background: var(--ink); color: var(--bg); font-size: 13px; line-height: 20px; text-align: center; font-weight: 800;
}
@keyframes pop { from { transform: scale(.85); opacity: .4; } to { transform: scale(1); opacity: 1; } }

/* 단계 제목 */
.step-title { font-size: 24px; font-weight: 900; margin: 0 0 4px; letter-spacing: -0.03em; }
.step-hint { margin: 0 0 16px; font-size: 13px; color: var(--muted); }

/* 검색 */
.search {
  width: 100%; padding: 14px 16px; margin-bottom: 14px;
  border-radius: 16px; border: 1px solid var(--line); background: var(--card); color: var(--ink); font: inherit;
  box-shadow: var(--shadow);
}
.search:focus-visible, .comment-form input:focus-visible { outline: 2px solid var(--brand); outline-offset: 1px; }

/* 재료 후보 */
.opts { display: grid; gap: 10px; }
.opt {
  display: grid; grid-template-columns: 1fr auto; row-gap: 10px; align-items: center;
  width: 100%; text-align: left; padding: 16px 18px;
  background: var(--card); border: 1px solid var(--line); border-radius: var(--radius);
  box-shadow: var(--shadow);
  transition: transform .1s ease, border-color .15s ease;
}
.opt:hover { border-color: var(--brand); transform: translateY(-1px); }
.opt:active { transform: scale(.98); }
.opt:focus-visible, .btn:focus-visible, .slot:focus-visible { outline: 2px solid var(--brand); outline-offset: 2px; }
.opt-name { display: inline-flex; align-items: center; gap: 8px; font-weight: 800; font-size: 16px; letter-spacing: -0.02em; }
.ico svg { width: 1.15em; height: 1.15em; display: block; }
.slot .emoji svg { width: 34px; height: 34px; }
.opt-pct { font-weight: 900; color: var(--brand); font-variant-numeric: tabular-nums; }
.bar { grid-column: 1 / -1; display: block; height: 8px; border-radius: 999px; background: var(--line); overflow: hidden; }
.fill { display: block; height: 100%; border-radius: 999px; background: var(--grad); }
.empty { padding: 16px; text-align: center; color: var(--muted); font-size: 14px; }

/* 버튼 */
.actions { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 20px; }
.btn {
  padding: 11px 16px; border-radius: 999px; border: 1px solid var(--line);
  background: var(--card); font-weight: 700; font-size: 14px; box-shadow: var(--shadow);
}
.btn.primary { background: var(--grad); color: var(--brand-ink); border-color: transparent; }
.btn.finish { width: 100%; padding: 16px; font-size: 16px; margin-top: 16px; }
.btn.on { border-color: var(--good); color: var(--good); }
.more { width: 100%; margin-top: 10px; }

/* 결과 */
.result {
  background: var(--card); border: 1px solid var(--line); border-radius: 28px;
  padding: 24px 20px; box-shadow: var(--shadow); animation: pop .3s ease-out;
}
.kicker { font-size: 12px; font-weight: 800; color: var(--brand); margin: 0 0 4px; letter-spacing: .02em; }
.result h2 { margin: 0 0 6px; font-size: 28px; letter-spacing: -0.04em; }
.tagline { margin: 0 0 14px; color: var(--muted); font-size: 14px; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 14px; }
.chip { font-size: 12px; font-weight: 600; padding: 4px 11px; border-radius: 999px; background: var(--bg); border: 1px solid var(--line); }
.chip.time { color: var(--muted); }
.stats { display: grid; gap: 14px; margin: 18px 0; }
.stat-row { display: grid; grid-template-columns: 1fr auto; row-gap: 6px; font-size: 14px; }
.stat-row b { font-variant-numeric: tabular-nums; color: var(--brand); }
.stat-row .bar { height: 10px; }
.note { font-size: 11px; color: var(--muted); margin: 6px 0 0; }
.section-title { font-size: 15px; font-weight: 900; margin: 22px 0 8px; }
.steps { margin: 0; padding-left: 20px; }
.steps li { margin-bottom: 6px; }
.tip { margin-top: 12px; padding: 12px 14px; border-radius: 16px; background: var(--bg); font-size: 13px; }

/* 코멘트 */
.comments { margin-top: 26px; }
.comment-form { display: flex; gap: 8px; }
.comment-form input {
  flex: 1; min-width: 0; padding: 13px 16px; border-radius: 999px;
  border: 1px solid var(--line); background: var(--card); color: var(--ink); font: inherit;
}
.comment-list { list-style: none; margin: 12px 0 0; padding: 0; display: grid; gap: 8px; }
.comment-list li { padding: 12px 14px; border-radius: 16px; background: var(--card); border: 1px solid var(--line); font-size: 14px; overflow-wrap: anywhere; }
.comment-list time { display: block; margin-top: 2px; font-size: 11px; color: var(--muted); }

.footer-note { margin-top: 30px; font-size: 11px; color: var(--muted); text-align: center; }

.still .slot.filled, .still .result { animation: none; }

@media (prefers-reduced-motion: reduce) {
  .slot.filled, .result { animation: none; }
  .opt, .slot.filled { transition: none; }
}

/* 전체 조합 보기 */
.top-right { display: flex; align-items: center; gap: 6px; }
.dex.listbtn { cursor: pointer; color: var(--ink); }
.dex.listbtn:focus-visible { outline: 2px solid var(--brand); outline-offset: 2px; }
.group-title { display: flex; align-items: center; gap: 8px; font-size: 15px; font-weight: 800; margin: 22px 0 8px; }
.group-count { margin-left: auto; font-size: 12px; font-weight: 600; color: var(--muted); }
.combo-card {
  display: grid; gap: 2px; width: 100%; text-align: left; padding: 14px 16px; margin-bottom: 8px;
  border: 1.5px solid var(--line); border-radius: 18px; background: var(--card);
}
.combo-card:hover { border-color: var(--accent, var(--brand)); }
.combo-card:focus-visible { outline: 2px solid var(--accent, var(--brand)); outline-offset: 2px; }
.cc-name { font-weight: 800; font-size: 16px; letter-spacing: -0.02em; }
.cc-items { font-size: 12px; color: var(--muted); }

/* 대분류 탭 */
.cats { display: flex; gap: 22px; overflow-x: auto; margin: 0 -16px 18px; padding: 0 16px; border-bottom: 1px solid var(--line); scrollbar-width: none; }
.cats::-webkit-scrollbar { display: none; }
.cat { flex: none; background: none; border: 0; border-bottom: 2.5px solid transparent; padding: 10px 0 11px; font-size: 16px; font-weight: 700; color: var(--muted); white-space: nowrap; }
.cat.on { color: var(--ink); border-bottom-color: var(--accent, var(--brand)); }
.cat:focus-visible { outline: 2px solid var(--accent, var(--brand)); outline-offset: 2px; }
.opt-cat { font-size: 11px; font-weight: 700; color: var(--muted); background: var(--fill, var(--bg)); border-radius: 999px; padding: 2px 8px; }

/* 첫 화면 메인 재료: 정사각형 3열 */
.opts.grid3 { grid-template-columns: repeat(3, 1fr); gap: 10px; }
.tile {
  aspect-ratio: 1; min-width: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px;
  padding: 10px 3px; text-align: center; background: var(--card);
  border: 1.5px solid var(--line); border-radius: 20px; box-shadow: var(--shadow, none);
  transition: border-color .15s ease, transform .1s ease;
}
.tile:hover { border-color: var(--accent, var(--brand)); background: var(--accent-soft, var(--bg)); }
.tile:active { transform: scale(.96); }
.tile:focus-visible { outline: 2px solid var(--accent, var(--brand)); outline-offset: 2px; }
.tile-ico { font-size: 30px; line-height: 1; }
.tile-ico .ico svg { width: 1.3em; height: 1.3em; }
.tile-name { font-size: 12px; letter-spacing: -0.03em; font-weight: 700; line-height: 1.25; word-break: keep-all; overflow-wrap: anywhere; }
.tile-pct { font-size: 11px; color: var(--muted); font-variant-numeric: tabular-nums; }

/* 메인 재료 타일: 1위는 넓은 카드, 퍼센트는 높낮이에 따라 색을 달리해요 */
.tile-ico { font-size: 32px; }
.tile-name { min-height: 2.5em; display: flex; align-items: center; justify-content: center; font-size: 14px; letter-spacing: -0.02em; }
.tile-name > span { display: block; text-wrap: balance; word-break: keep-all; }
.hero-wrap:not(:empty) { margin-bottom: 10px; }
.pct { display: inline-block; padding: 3px 10px; border-radius: 999px; font-size: 12px; font-weight: 800; font-variant-numeric: tabular-nums; }
.pct-hi { background: linear-gradient(135deg, var(--accent-b, #ffb02e), var(--accent, var(--brand))); color: #2a1204; }
.pct-mid { background: var(--accent-soft, var(--bg)); color: #c4531a; }
.pct-low { background: var(--fill, var(--bg)); color: var(--muted); }
.tile.top {
  width: 100%; aspect-ratio: auto; flex-direction: row; justify-content: flex-start; gap: 14px; padding: 16px 18px; text-align: left;
  border-color: var(--accent, var(--brand)); background: linear-gradient(135deg, var(--accent-soft, var(--bg)), var(--card));
}
.tile.top .tile-ico { font-size: 40px; }
.tile.top .tile-info { display: grid; gap: 2px; flex: 1; min-width: 0; }
.tile.top .tile-name { min-height: 0; justify-content: flex-start; font-size: 18px; font-weight: 800; text-align: left; }
.tile.top .tile-sub { font-size: 12px; color: var(--muted); }
.tile.top .pct { font-size: 16px; padding: 5px 14px; }

/* 나만의 조합 */
.add-combo { width: 100%; margin-top: 12px; border: 1.5px dashed var(--line); background: transparent; box-shadow: none; border-radius: 18px; padding: 14px; color: var(--muted); }
.add-combo:hover { border-color: var(--accent, var(--brand)); color: var(--ink); }
.field { width: 100%; padding: 13px 16px; border-radius: 14px; border: 1px solid var(--line); background: var(--fill, var(--card)); color: var(--ink); font: inherit; }
textarea.field { resize: vertical; min-height: 120px; line-height: 1.5; border-radius: 16px; }
.field:focus-visible { outline: 2px solid var(--accent, var(--brand)); outline-offset: 1px; }
.form-block { display: grid; gap: 8px; margin-top: 18px; }
.form-label { font-size: 14px; font-weight: 800; }
.form-hint { margin: 0; font-size: 12px; color: var(--muted); }
.edit-chips { display: flex; flex-wrap: wrap; gap: 6px; }
.edit-chip { display: inline-flex; align-items: center; gap: 6px; padding: 6px 12px; border-radius: 999px; border: 1.5px solid var(--line); background: var(--card); font-size: 13px; font-weight: 700; }
.edit-chip.fixed { background: var(--fill, var(--bg)); }
.edit-chip .x { color: var(--muted); font-size: 15px; line-height: 1; }
.row-add { display: flex; gap: 8px; }
.row-add .btn { flex: none; }
.row-add .field { flex: 1; min-width: 0; }
.icon-pick { padding: 12px; border-radius: 16px; background: var(--fill, var(--bg)); }
.icon-pick-title { margin: 0; font-size: 13px; font-weight: 700; }
.icon-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(44px, 1fr)); gap: 6px; margin-top: 8px; }
.icon-opt { aspect-ratio: 1; padding: 0; display: flex; align-items: center; justify-content: center; font-size: 22px; border: 1.5px solid transparent; border-radius: 12px; background: var(--card); }
.icon-opt.on { border-color: var(--accent, var(--brand)); }
.icon-opt:focus-visible { outline: 2px solid var(--accent, var(--brand)); outline-offset: 1px; }
.icon-opt .ico svg { width: 1.1em; height: 1.1em; display: block; }
.err { margin: 8px 0 0; min-height: 1.2em; font-size: 13px; font-weight: 700; color: #d93a2b; }
.mine-tag { margin-left: 8px; }

/* 별점 */
.rating { margin-top: 26px; }
.stars { display: flex; gap: 4px; }
.star { background: none; border: 0; padding: 2px; font-size: 42px; line-height: 1; color: #d9d9de; transition: transform .12s ease, color .15s ease; }
.star.on { color: #ffb400; }
.star:active { transform: scale(.88); }
.star.pop { animation: starpop .28s ease-out; }
@keyframes starpop { 50% { transform: scale(1.3); } }
.star:focus-visible { outline: 2px solid var(--accent, var(--brand)); outline-offset: 2px; border-radius: 10px; }
.rating-note { margin: 6px 0 0; font-size: 13px; color: var(--muted); }
.cc-star { margin-left: 8px; font-size: 13px; font-weight: 800; color: #ffb400; }
@media (prefers-reduced-motion: reduce) { .star.pop { animation: none; } .star { transition: none; } }

/* 하단 이동칸 */
#app { padding-bottom: calc(104px + env(safe-area-inset-bottom, 0px)); }
.navbar { position: fixed; left: 0; right: 0; bottom: 0; z-index: 20; background: var(--card); border-top: 1px solid var(--line); padding-bottom: env(safe-area-inset-bottom, 0px); }
.navbar-in { max-width: 480px; margin: 0 auto; display: grid; grid-template-columns: repeat(4, 1fr); }
.nav-item { display: flex; flex-direction: column; align-items: center; gap: 3px; padding: 10px 4px 9px; background: none; border: 0; color: var(--muted); font-size: 11px; font-weight: 700; }
.nav-item svg { width: 26px; height: 26px; display: block; }
.nav-item.on { color: var(--ink); }
.nav-item.on svg { color: var(--accent, var(--brand)); }
.nav-item:focus-visible { outline: 2px solid var(--accent, var(--brand)); outline-offset: -4px; border-radius: 12px; }

/* 홈 */
.home-date { margin: 0; font-size: 13px; font-weight: 700; color: var(--muted); }
.home-title { margin: 2px 0 16px; font-size: 26px; font-weight: 900; letter-spacing: -0.03em; }
.hero-card { display: grid; gap: 10px; width: 100%; text-align: left; padding: 20px; border-radius: 28px; border: 1.5px solid var(--accent, var(--brand)); background: linear-gradient(135deg, var(--accent-soft, #fff3ec), var(--card)); box-shadow: var(--shadow, none); }
.hero-label { font-size: 12px; font-weight: 800; color: var(--accent, var(--brand)); }
.hero-icons { display: flex; align-items: center; gap: 4px; font-size: 38px; line-height: 1; }
.hero-icons .ico svg { width: 1.2em; height: 1.2em; display: block; }
.hero-name { margin: 0; font-size: 24px; font-weight: 900; letter-spacing: -0.03em; }
.hero-sub { margin: 0; font-size: 13px; color: var(--muted); }
.hero-go { font-size: 14px; font-weight: 800; }
.section-head { display: flex; align-items: baseline; justify-content: space-between; margin: 28px 0 10px; }
.section-head .section-title { margin: 0; }
.rail { display: flex; gap: 10px; overflow-x: auto; margin: 0 -16px; padding: 2px 16px 10px; scroll-snap-type: x proximity; scroll-padding: 0 16px; scrollbar-width: none; }
.rail::-webkit-scrollbar { display: none; }
.mini-card { flex: none; width: 152px; scroll-snap-align: start; display: grid; align-content: start; gap: 6px; padding: 14px; text-align: left; border-radius: 20px; border: 1.5px solid var(--line); background: var(--card); }
.mini-icons { display: flex; align-items: center; gap: 2px; min-height: 30px; font-size: 26px; line-height: 1; }
.mini-icons .ico svg { width: 1.2em; height: 1.2em; display: block; }
.mini-name { font-size: 15px; font-weight: 800; letter-spacing: -0.02em; line-height: 1.25; }
.mini-sub { font-size: 12px; line-height: 1.35; color: var(--muted); display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.mini-card:hover, .combo-card:hover { border-color: var(--accent, var(--brand)); }
.find-cta { display: flex; align-items: center; justify-content: space-between; width: 100%; margin-top: 24px; padding: 18px 20px; border: 0; border-radius: 22px; background: linear-gradient(135deg, var(--accent-b, #ffb02e), var(--accent, var(--brand))); color: #2a1204; text-align: left; box-shadow: 0 8px 20px rgba(255, 122, 61, .28); }
.find-cta b { display: block; font-size: 17px; letter-spacing: -0.02em; }
.find-cta span { font-size: 12px; font-weight: 600; opacity: .85; }
.find-cta .go { font-size: 22px; opacity: 1; }
.cat-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
.cat-tile { display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 14px 6px 12px; border-radius: 20px; border: 1.5px solid var(--line); background: var(--card); font-size: 13px; font-weight: 700; }
.cat-tile .ico { font-size: 28px; line-height: 1.1; }
.cat-tile .ico svg { width: 1.3em; height: 1.3em; display: block; }
.cat-tile small { font-size: 11px; font-weight: 600; color: var(--muted); }
.cat-tile:hover { border-color: var(--accent, var(--brand)); }
.progress-card { display: grid; gap: 8px; width: 100%; margin-top: 22px; padding: 16px 18px; border: 0; border-radius: 22px; background: var(--fill, var(--bg)); text-align: left; }
.progress-card b { font-size: 15px; }
.progress-card .bar { margin: 0; }

/* 마이 / 더보기 */
.my-summary { display: grid; gap: 8px; margin: 14px 0 4px; padding: 20px; border-radius: 24px; background: var(--fill, var(--bg)); }
.my-num { font-size: 34px; font-weight: 900; letter-spacing: -0.03em; }
.my-num small { font-size: 16px; font-weight: 700; color: var(--muted); }
.my-empty { margin: 0 0 6px; padding: 14px 16px; border-radius: 16px; background: var(--fill, var(--bg)); font-size: 13px; color: var(--muted); }
.more-row { display: flex; align-items: center; justify-content: space-between; width: 100%; margin-bottom: 8px; padding: 16px 18px; text-align: left; border-radius: 18px; border: 1.5px solid var(--line); background: var(--card); }
.more-row:hover:not([disabled]) { border-color: var(--accent, var(--brand)); }
.more-row[disabled] { opacity: .55; cursor: default; }
.more-text { display: grid; gap: 2px; }
.more-text b { font-size: 16px; letter-spacing: -0.02em; }
.more-sub { font-size: 12px; color: var(--muted); }
.more-arrow { font-size: 13px; font-weight: 700; color: var(--muted); }
.about { margin-top: 16px; padding: 16px 18px; border-radius: 18px; background: var(--fill, var(--bg)); font-size: 13px; line-height: 1.6; color: var(--muted); }
.edit-chip.sel { border-color: var(--accent, var(--brand)); background: var(--accent-soft, var(--bg)); }
.back-link { margin-bottom: 4px; }

/* 레퍼런스 느낌의 홈: 주황 배너 + 아이콘 분류 칸 */
.home-banner { margin: -20px -16px 0; padding: 22px 20px 46px; border-radius: 0 0 32px 32px; background: linear-gradient(135deg, #ff9a45, #ff5a2e); color: #fff; }
.banner-top { display: flex; align-items: baseline; justify-content: space-between; }
.banner-logo { font-size: 26px; font-weight: 900; letter-spacing: -0.04em; }
.banner-date { font-size: 13px; font-weight: 700; opacity: .95; }
.banner-title { margin: 14px 0 16px; font-size: 25px; font-weight: 900; letter-spacing: -0.03em; line-height: 1.25; }
.banner-search { display: flex; align-items: center; gap: 8px; width: 100%; padding: 13px 16px; border: 0; border-radius: 999px; background: #fff; color: #8a8a8e; font-size: 14px; font-weight: 600; text-align: left; }

  function productImg(name, cat) {
    const g = PRODUCT_IMG[cat || state.cat];
    if (g && g[name]) return g[name];
    const hits = Object.keys(PRODUCT_IMG).filter((k) => PRODUCT_IMG[k][name]);
    return hits.length === 1 ? PRODUCT_IMG[hits[0]][name] : '';
  }
  function iconEl(name, cat) {
    const el = document.createElement('span');
    el.className = 'ico';
    el.setAttribute('aria-hidden', 'true');
    const pimg = productImg(name, cat);
    if (pimg) {
      const im = document.createElement('img');
      im.src = pimg;
      im.alt = '';
      im.draggable = false;
      el.append(im);
      return el;
    }
    const emoji = emojiFor(name);
    if (CUSTOM_ICON[name]) { fillIcon(el, CUSTOM_ICON[name]); return el; }
    if (SVG_ICONS[name]) el.innerHTML = SVG_ICONS[name];
    else if ((cat || state.cat) === '컵라면' && (emoji === '🍜' || emoji === '🍝')) el.innerHTML = CUP_SVG;
    else el.textContent = emoji;
    return el;
  }

  /* ---------- 공통 조각 ---------- */
  function header() {
    return h('header', { class: 'top' },
      h('div', { class: 'brand' },
        h('span', { class: 'logo' }, '찰떡'),
        h('span', { class: 'sub' }, '세상 모든 꿀조합')));
  }

  function tray() {
    const slots = [];
    // 칸은 한 줄(4칸)씩 늘어나요. 고른 재료 + 다음 한 칸이 들어갈 만큼만 보여요.
    const cap = maxFor(state.cat);
    const need = state.chosen.length + (state.combo ? 0 : 1);
    const total = Math.min(cap, Math.max(MAX_STEPS, Math.ceil(need / MAX_STEPS) * MAX_STEPS));
    for (let i = 0; i < total; i++) {
      const it = state.chosen[i];
      slots.push(it
        ? h('button', {
            class: 'slot filled', type: 'button',
            'aria-label': it + (i === 0 ? ' 빼고 처음부터' : ' 빼기'),
            title: i === 0 ? '누르면 처음부터' : '눌러서 빼기',
            onclick: () => removeAt(i)
          },
          h('span', { class: 'emoji' }, iconEl(it)),
          h('span', { class: 'sname' }, it),
          h('span', { class: 'x', 'aria-hidden': 'true' }, '×'))
        : h('div', { class: 'slot' }, h('span', { class: 'num' }, i + 1), '?'));
    }
    return h('section', { class: 'tray', 'aria-label': '고른 재료' }, slots);
  }

  // 긴 이름은 '불닭' 앞에서만 줄이 바뀌도록 보이지 않는 줄바꿈 자리를 넣어요.
  function softBreak(name) { return name.replace(/(?!^)불닭/g, '\u200b불닭'); }

  // 첫 화면 메인 재료 버튼 (정사각형, 1위는 넓은 카드). 퍼센트 색은 목록 안에서의 높낮이로 정해요.
  function mainTile(o, showCat, tier, hero) {
    const pct = h('span', { class: 'pct pct-' + tier }, o.percent + '%');
    if (hero) {
      return h('button', { class: 'tile top', type: 'button', onclick: () => choose(o.item, o.cat) },
        h('span', { class: 'tile-ico' }, iconEl(o.item, o.cat)),
        h('span', { class: 'tile-info' },
          h('span', { class: 'tile-name' }, h('span', {}, softBreak(o.item))),
          h('span', { class: 'tile-sub' }, '가장 많이 고르는 메인')),
        pct);
    }
    return h('button', { class: 'tile', type: 'button', onclick: () => choose(o.item, o.cat) },
      h('span', { class: 'tile-ico' }, iconEl(o.item, o.cat)),
      h('span', { class: 'tile-name' }, h('span', {}, softBreak(o.item))),
      showCat ? h('span', { class: 'opt-cat' }, o.cat) : pct);
  }

  function optionButton(o, showCat) {
    return h('button', { class: 'opt', type: 'button', onclick: () => choose(o.item, o.cat) },
      h('span', { class: 'opt-name' }, iconEl(o.item), o.item,
        showCat ? h('span', { class: 'opt-cat' }, o.cat) : null),
      h('span', { class: 'opt-pct' }, o.percent + '%'),
      h('span', { class: 'bar' }, h('span', { class: 'fill', style: 'width:' + o.percent + '%' })));
  }

  // 대분류 탭 (첫 화면에서만 보여요)
  function catBar() {
    const extra = COMBOS.map((c) => c.cat).filter((c, i, a) => c && CATEGORIES.indexOf(c) === -1 && a.indexOf(c) === i);
    const cats = CATEGORIES.concat(extra);
    return h('nav', { class: 'cats', 'aria-label': '대분류' },
      cats.map((c) => h('button', {
        class: 'cat' + (state.cat === c ? ' on' : ''), type: 'button',
        'aria-pressed': state.cat === c ? 'true' : 'false',
        onclick: () => { state.cat = c; state.query = ''; render(true); }
      }, c)));
  }

  /* ---------- 재료 고르기 화면 ---------- */
  function pickView() {
    const n = state.chosen.length + 1;
    const all = L.nextOptions(COMBOS, state.chosen, 0, state.cat);
    const optsEl = h('div', { class: 'opts grid3' });
    const heroEl = h('div', { class: 'hero-wrap' });
    const moreWrap = h('div', {});

    function fill() {
      optsEl.replaceChildren();
      heroEl.replaceChildren();
      moreWrap.replaceChildren();
      let list;
      const q = n === 1 ? state.query.trim() : '';
      if (n === 1) {
        list = q ? all.filter((o) => o.item.includes(q)) : all.filter((o) => o.cat === state.cat);
      } else {
        list = state.expanded ? all : all.slice(0, VISIBLE);
      }
      if (list.length === 0) {
        optsEl.append(h('p', { class: 'empty' }, '찾는 재료가 아직 없어요.'));
      } else {
        const maxPct = Math.max.apply(null, list.map((o) => o.percent));
        list.forEach((o, i) => {
          const r = maxPct ? o.percent / maxPct : 0;
          const hero = n === 1 && !q && i === 0;
          (hero ? heroEl : optsEl).append(mainTile(o, !!q, r >= 0.6 ? 'hi' : r >= 0.3 ? 'mid' : 'low', hero));
        });
      }
      const hidden = n === 1 ? 0 : all.length - list.length;
      if (hidden > 0) {
        moreWrap.append(h('button', {
          class: 'btn more', type: 'button',
          onclick: () => { state.expanded = true; fill(); }
        }, '나머지 ' + hidden + '개 더 보기'));
      }
    }

    const done = L.findComplete(COMBOS, state.chosen, state.cat);

    const view = h('section', {},
      h('h1', { class: 'step-title' }, n === 1 ? '메인 재료부터 골라요' : n + '번째 재료를 골라요'),
      h('p', { class: 'step-hint' },
        n === 1 ? '메인 재료를 고르면 어울리는 재료가 이어서 나와요.' : '숫자는 이 재료를 고른 사람의 비율이에요.'));

    if (n === 1) {
      view.append(h('input', {
        class: 'search', type: 'search', placeholder: '메인 재료 검색 (예: 불닭, 신라면)',
        'aria-label': '메인 재료 검색', value: state.query,
        oninput: (e) => { state.query = e.target.value; fill(); }
      }));
    }

    view.append(heroEl, optsEl, moreWrap);
    if (n >= 2) view.append(h('button', { class: 'btn add-combo', type: 'button', onclick: openAdd }, '+ 나만의 조합 넣기'));

    if (done) {
      view.append(h('button', { class: 'btn primary finish', type: 'button', onclick: finish }, '여기서 완성하기'));
    }

    const actions = h('div', { class: 'actions' });
    if (state.chosen.length > 0) {
      actions.append(
        h('button', { class: 'btn', type: 'button', onclick: back }, '← 한 단계 뒤로'),
        h('button', { class: 'btn', type: 'button', onclick: reset }, '처음부터'));
    }
    view.append(actions);

    fill();
    return view;
  }

  /* ---------- 전체 조합 화면 ---------- */
  function listView() {
    const listEl = h('div', { class: 'all-list' });
    const mains = L.nextOptions(COMBOS, [], 0);

    function fill() {
      const q = state.listQuery.trim();
      const hit = COMBOS.filter((c) => !q || c.name.includes(q) || c.items.some((i) => i.includes(q)));
      listEl.replaceChildren();
      if (hit.length === 0) {
        listEl.append(h('p', { class: 'empty' }, '찾는 조합이 없어요.'));
        return;
      }
      mains.forEach((mo) => {
        const m = mo.item;
        const group = hit.filter((c) => c.main === m && c.cat === mo.cat);
        if (group.length === 0) return;
        listEl.append(h('h3', { class: 'group-title' }, iconEl(m, mo.cat), m, h('span', { class: 'opt-cat' }, mo.cat), h('span', { class: 'group-count' }, group.length + '개')));
        group.forEach((c) => listEl.append(h('button', { class: 'combo-card', type: 'button', onclick: () => openCombo(c) },
          h('span', { class: 'cc-name' }, c.name, c.mine ? h('span', { class: 'opt-cat mine-tag' }, '내 조합') : null,
            lsGet(KEY_RATING + c.id, 0) ? h('span', { class: 'cc-star' }, '★' + lsGet(KEY_RATING + c.id, 0)) : null),
          h('span', { class: 'cc-items' }, c.items.filter((i) => i !== m).join(' + ')))));
      });
    }

    const view = h('section', {},
      h('h1', { class: 'step-title' }, '전체 조합'),
      h('p', { class: 'step-hint' }, '지금까지 등록된 ' + COMBOS.length + '개 조합이에요. 눌러서 만드는 법을 볼 수 있어요.'),
      h('input', {
        class: 'search', type: 'search', placeholder: '조합·재료 검색 (예: 치즈, 불계치)',
        'aria-label': '조합 검색', value: state.listQuery,
        oninput: (e) => { state.listQuery = e.target.value; fill(); }
      }),
      listEl,
      h('div', { class: 'actions' },
        h('button', { class: 'btn primary', type: 'button', onclick: reset }, '재료 골라서 찾기')));
    fill();
    return view;
  }

  /* ---------- 나만의 조합 넣기 ---------- */
  const ICON_CHOICES = ['🧀', '🥚', '🍳', '🥓', '🌽', '🧅', '🧄', '🌶️', '🍙', '🍚', '🥛', '🧈', '🥟', '🍗', '🥩', '🥬',
    '🍄', '🦐', '🐟', '🍤', '🥔', '🍞', '🧂', '☕', '🧊', '🍌', '🍅', '🍦', 'svg:소시지', 'svg:컵 떡볶이', 'svg:컵라면'];

  function openAdd() {
    const locked = state.chosen.length > 0;
    state.draft = {
      name: '', items: state.chosen.slice(1), icons: {}, text: '', input: '', err: '',
      main: locked ? state.chosen[0] : '', mainText: '', cat: locked ? state.cat : (state.cat || CATEGORIES[0])
    };
    state.view = 'add';
    render();
  }

  function cancelAdd() {
    state.draft = null;
    state.view = state.chosen.length ? 'pick' : 'home';
    render();
  }

  // 새로 쓴 재료인지(= 아이콘을 직접 골라야 하는지)
  function isNewItem(name) {
    return !CUSTOM_ICON[name] && !EMOJI[name] && !SVG_ICONS[name] && !COMBOS.some((c) => c.items.indexOf(name) !== -1);
  }

  function delMine(c) {
    if (state.confirmDel !== c.id) { state.confirmDel = c.id; render(true); return; }
    const i = COMBOS.indexOf(c);
    if (i !== -1) COMBOS.splice(i, 1);
    saveMine();
    state.confirmDel = null;
    state.combo = null;
    state.chosen = [];
    state.view = state.fromList || 'home';
    state.fromList = '';
    render();
  }

  function addView() {
    const d = state.draft;
    const locked = state.chosen.length > 0;
    const curMain = () => (locked ? state.chosen[0] : (d.mainText.trim() || d.main));
    const curCat = () => (locked ? state.cat : d.cat);

    function redraw(focusId) {
      render(true);
      const el = focusId && document.getElementById(focusId);
      if (el) el.focus();
    }
    function fail(msg) { d.err = msg; redraw(); }
    function addItem() {
      const main = curMain();
      const name = d.input.trim();
      if (!name) return;
      if (!main) return fail('먼저 메인 재료를 골라 주세요.');
      if (name === main || d.items.indexOf(name) !== -1) return fail('이미 들어 있는 재료예요.');
      if (d.items.length >= maxFor(curCat()) - 1) return fail('재료는 메인을 포함해 ' + maxFor(curCat()) + '개까지예요.');
      d.items.push(name);
      if (isNewItem(name) && !d.icons[name]) d.icons[name] = '🍴';
      d.input = '';
      d.err = '';
      redraw('mine-item');
    }
    function removeItem(name) {
      d.items = d.items.filter((x) => x !== name);
      delete d.icons[name];
      d.err = '';
      redraw();
    }
    function save() {
      const main = curMain();
      const cat = curCat();
      const name = d.name.trim();
      const steps = d.text.split('\n').map((x) => x.trim()).filter(Boolean);
      const items = [main].concat(d.items);
      if (!main) return fail('메인 재료를 골라 주세요.');
      if (!name) return fail('조합 이름을 적어 주세요.');
      if (d.items.length < 1) return fail('재료를 하나 이상 추가해 주세요.');
      if (d.items.indexOf(main) !== -1) return fail('메인 재료와 같은 재료가 들어 있어요.');
      if (steps.length < 1) return fail('만드는 법을 한 줄 이상 적어 주세요.');
      const dup = L.findComplete(COMBOS, items, cat);
      if (dup) return fail('이미 있는 조합이에요: ' + dup.name);
      const icons = {};
      items.forEach((it) => { if (isNewItem(it)) icons[it] = d.icons[it] || '🍴'; });
      const c = {
        id: 'mine-' + Date.now(), main: main, cat: cat, src: 'mine', mine: true,
        name: name, items: items, tagline: '', tags: [], minutes: null, steps: steps, tip: '',
        votes: 1, score: null, icons: icons
      };
      COMBOS.push(c);
      Object.assign(CUSTOM_ICON, icons);
      saveMine();
      state.cat = cat;
      state.chosen = items.slice();
      state.combo = c;
      state.view = 'pick';
      state.fromList = '';
      state.draft = null;
      render();
    }

    const main0 = curMain();
    const known = [];
    COMBOS.forEach((c) => c.items.forEach((i) => { if (i !== main0 && known.indexOf(i) === -1 && d.items.indexOf(i) === -1) known.push(i); }));
    const mainsInCat = L.nextOptions(COMBOS, [], 0).filter((o) => o.cat === d.cat).map((o) => o.item);
    const needIcon = [main0].concat(d.items).filter((x) => x && isNewItem(x));

    const mainPicker = locked ? null : [
      h('div', { class: 'form-block' },
        h('span', { class: 'form-label' }, '분류'),
        h('div', { class: 'edit-chips' }, CATEGORIES.map((c) => h('button', {
          class: 'edit-chip' + (d.cat === c ? ' sel' : ''), type: 'button', 'aria-pressed': d.cat === c ? 'true' : 'false',
          onclick: () => { d.cat = c; d.main = ''; d.mainText = ''; d.err = ''; redraw(); }
        }, c)))),
      h('div', { class: 'form-block' },
        h('span', { class: 'form-label' }, '메인 재료'),
        h('div', { class: 'edit-chips' }, mainsInCat.map((m) => h('button', {
          class: 'edit-chip' + (d.main === m && !d.mainText.trim() ? ' sel' : ''), type: 'button',
          onclick: () => { d.main = m; d.mainText = ''; d.err = ''; redraw(); }
        }, iconEl(m, d.cat), m))),
        h('div', { class: 'row-add' },
          h('input', {
            id: 'mine-main', class: 'field', type: 'text', maxlength: '15', value: d.mainText, 'aria-label': '메인 재료 직접 입력',
            placeholder: '목록에 없으면 직접 입력 (예: 신라면 블랙)',
            oninput: (e) => { d.mainText = e.target.value; },
            onkeydown: (e) => { if (e.key === 'Enter') { e.preventDefault(); d.err = ''; redraw(); } }
          }),
          h('button', { class: 'btn', type: 'button', onclick: () => { d.err = ''; redraw(); } }, '선택')))
    ];

    return h('section', {},
      h('h1', { class: 'step-title' }, '나만의 조합 만들기'),
      h('p', { class: 'step-hint' }, locked ? '메인 재료는 ' + main0 + '예요. 이 브라우저에만 저장돼요.' : '분류와 메인 재료를 고르고 조합을 적어요. 이 브라우저에만 저장돼요.'),
      mainPicker,
      h('div', { class: 'form-block' },
        h('label', { class: 'form-label', for: 'mine-name' }, '조합 이름'),
        h('input', {
          id: 'mine-name', class: 'field', type: 'text', maxlength: '20', placeholder: '예: 나만의 불닭 크림', value: d.name,
          oninput: (e) => { d.name = e.target.value; }
        })),
      h('div', { class: 'form-block' },
        h('span', { class: 'form-label' }, '재료 (메인 포함 최대 ' + maxFor(curCat()) + '개)'),
        h('div', { class: 'edit-chips' },
          main0 ? h('span', { class: 'edit-chip fixed' }, iconEl(main0, curCat()), main0) : h('span', { class: 'form-hint' }, '메인 재료를 먼저 골라 주세요.'),
          d.items.map((it) => h('button', {
            class: 'edit-chip', type: 'button', 'aria-label': it + ' 빼기', onclick: () => removeItem(it)
          }, iconEl(it, curCat()), it, h('span', { class: 'x', 'aria-hidden': 'true' }, '×')))),
        h('div', { class: 'row-add' },
          h('input', {
            id: 'mine-item', class: 'field', type: 'text', maxlength: '15', list: 'mine-suggest',
            placeholder: '재료 이름 (예: 슬라이스 치즈)', value: d.input, 'aria-label': '재료 이름',
            oninput: (e) => { d.input = e.target.value; },
            onkeydown: (e) => { if (e.key === 'Enter') { e.preventDefault(); addItem(); } }
          }),
          h('button', { class: 'btn', type: 'button', onclick: addItem }, '추가')),
        h('datalist', { id: 'mine-suggest' }, known.map((n) => h('option', { value: n })))),
      needIcon.map((it) => h('div', { class: 'form-block icon-pick' },
        h('p', { class: 'icon-pick-title' }, '「' + it + '」 아이콘을 골라요'),
        h('div', { class: 'icon-grid' }, ICON_CHOICES.map((ic) => {
          const on = (d.icons[it] || '🍴') === ic;
          const o = h('button', {
            class: 'icon-opt' + (on ? ' on' : ''), type: 'button',
            'aria-label': '아이콘 ' + ic, 'aria-pressed': on ? 'true' : 'false',
            onclick: () => { d.icons[it] = ic; redraw(); }
          });
          const span = document.createElement('span');
          span.className = 'ico';
          fillIcon(span, ic);
          o.append(span);
          return o;
        })))),
      h('div', { class: 'form-block' },
        h('label', { class: 'form-label', for: 'mine-steps' }, '만드는 법'),
        h('p', { class: 'form-hint' }, '한 줄에 한 단계씩 적어요.'),
        h('textarea', {
          id: 'mine-steps', class: 'field', rows: '5', placeholder: '1단계 내용\n2단계 내용',
          oninput: (e) => { d.text = e.target.value; }
        }, d.text)),
      h('p', { class: 'err', role: 'alert' }, d.err),
      h('div', { class: 'actions' },
        h('button', { class: 'btn primary', type: 'button', onclick: save }, '저장하기'),
        h('button', { class: 'btn', type: 'button', onclick: cancelAdd }, '취소')));
  }

  /* ---------- 별점 (이 브라우저에만 저장) ---------- */
  function ratingSection(c) {
    const key = KEY_RATING + c.id;
    const noteText = (v) => (v ? '내 별점 ' + v + '점 · 같은 별을 다시 누르면 취소돼요' : '별을 눌러 이 조합의 별점을 남겨보세요');
    const note = h('p', { class: 'rating-note', 'aria-live': 'polite' }, noteText(lsGet(key, 0)));
    const stars = [1, 2, 3, 4, 5].map((i) => h('button', {
      class: 'star' + (lsGet(key, 0) >= i ? ' on' : ''), type: 'button', role: 'radio',
      'aria-label': i + '점', 'aria-checked': lsGet(key, 0) === i ? 'true' : 'false',
      onclick: (e) => {
        const v = lsGet(key, 0) === i ? 0 : i;
        lsSet(key, v);
        stars.forEach((b, j) => {
          b.classList.toggle('on', j < v);
          b.setAttribute('aria-checked', j + 1 === v ? 'true' : 'false');
        });
        note.textContent = noteText(v);
        if (v) { e.currentTarget.classList.remove('pop'); void e.currentTarget.offsetWidth; e.currentTarget.classList.add('pop'); }
      }
    }, '★'));
    return h('section', { class: 'rating' },
      h('h3', { class: 'section-title' }, '이 조합 별점'),
      h('div', { class: 'stars', role: 'radiogroup', 'aria-label': '별점' }, stars),
      note);
  }

  /* ---------- 결과 화면 ---------- */
  function statRow(label, value, note) {
    return h('div', { class: 'stat-row' },
      h('span', {}, label),
      h('b', {}, value + '%'),
      h('span', { class: 'bar' }, h('span', { class: 'fill', style: 'width:' + value + '%' })),
      note ? h('span', { class: 'note' }, note) : null);
  }

  function commentsSection(combo) {
    if (!state.cdraft || state.cdraft.id !== combo.id) state.cdraft = { id: combo.id, text: '', img: '', err: '' };
    const d = state.cdraft;
    const list = collectPosts().filter((p) => p.combo === combo.name).sort((a, b) => a.ageMin - b.ageMin);
    return h('section', { class: 'comments' },
      h('h3', { class: 'section-title' }, '후기 · 사진'),
      h('p', { class: 'form-hint', style: 'margin:0 0 8px' }, '남긴 글은 커뮤니티에도 바로 올라가요.'),
      h('div', { class: 'composer' },
        h('textarea', {
          id: 'cm-text', class: 'field', rows: '2', maxlength: '100', placeholder: '이 조합 먹어봤다면 한마디 남겨 주세요', 'aria-label': '후기 쓰기',
          oninput: (e) => { d.text = e.target.value; }
        }, d.text),
        d.img ? h('div', { class: 'photo-prev' },
          h('img', { src: d.img, alt: '첨부한 사진 미리보기' }),
          h('button', { type: 'button', 'aria-label': '사진 빼기', onclick: () => { d.img = ''; render(true); } }, '×')) : null,
        h('input', {
          id: 'cm-photo', type: 'file', accept: 'image/*', hidden: true, 'aria-label': '사진 고르기',
          onchange: (e) => {
            const file = e.target.files && e.target.files[0];
            if (!file) return;
            readPhoto(file, (url) => {
              if (!url) d.err = '이 사진은 불러올 수 없어요. 다른 사진으로 해 보세요.';
              else { d.img = url; d.err = ''; }
              render(true);
            });
          }
        }),
        h('div', { class: 'composer-actions' },
          h('button', { class: 'btn', type: 'button', onclick: () => document.getElementById('cm-photo').click() }, d.img ? '📷 사진 바꾸기' : '📷 사진 추가'),
          h('button', {
            class: 'btn primary', type: 'button',
            onclick: () => {
              if (savePost(d, combo.name)) state.cdraft = null;
              render(true);
            }
          }, '남기기')),
        h('p', { class: 'err', role: 'alert' }, d.err || '')),
      h('div', { class: 'posts' }, list.length
        ? list.map((p) => postCard(p, true))
        : h('p', { class: 'my-empty' }, '아직 후기가 없어요. 첫 후기를 남겨 보세요!')));
  }

  function resultView() {
    const c = state.combo;
    const rate = L.pickRate(COMBOS, c);
    const isTried = lsGet(KEY_TRIED, []).indexOf(c.id) !== -1;
    const cr = state.fromList === 'vote' && state.candId ? weekCandidates().find((x) => x.id === state.candId) : null;
    const voteBtn = cr ? h('button', {
      class: 'btn' + (cr.voted ? ' on' : ''), type: 'button', 'aria-pressed': cr.voted ? 'true' : 'false',
      onclick: () => toggleVote(cr.id)
    }, (cr.voted ? '♥ 투표함 ' : '♡ 투표하기 ') + cr.total) : null;

    return h('section', {},
      h('article', { class: 'result' },
        h('p', { class: 'kicker' }, c.cand ? '투표 후보 · 예시' : (c.mine ? '내 조합' : '조합 완성!')),
        h('h2', {}, c.name),
        c.tagline ? h('p', { class: 'tagline' }, c.tagline) : null,
        h('div', { class: 'chips' },
          c.tags.map((t) => h('span', { class: 'chip' }, '#' + t)),
          c.minutes ? h('span', { class: 'chip time' }, '약 ' + c.minutes + '분') : null,
          c.mine ? h('span', { class: 'chip time' }, '내가 만든 조합') : null,
          c.cand ? h('span', { class: 'chip time' }, '예시 후보') : null),
        (c.mine || c.cand) ? null : h('div', { class: 'stats' },
          statRow('같은 메인 재료 중 이 조합 비율', rate),
          statRow('맛 점수', c.score, '※ 숫자는 임시 샘플 값이에요.')),
        h('h3', { class: 'section-title' }, '만드는 법'),
        h('ol', { class: 'steps' }, c.steps.map((s) => h('li', {}, s))),
        c.tip ? h('p', { class: 'tip' }, '💡 ' + c.tip) : null),
      h('div', { class: 'actions' },
        h('button', {
          class: 'btn' + (isTried ? ' on' : ''), type: 'button',
          'aria-pressed': isTried ? 'true' : 'false',
          onclick: () => toggleTried(c.id)
        }, isTried ? '✓ 먹어봤어요' : '먹어봤어요'),
        h('button', { class: 'btn', type: 'button', onclick: back }, '← 뒤로'),
        h('button', { class: 'btn primary', type: 'button', onclick: reset }, '다른 조합 찾기'),
        c.mine ? h('button', { class: 'btn', type: 'button', onclick: () => delMine(c) },
          state.confirmDel === c.id ? '한 번 더 누르면 삭제' : '삭제') : null,
        voteBtn),
      (cr && state.voteMsg) ? h('p', { class: 'err', role: 'alert' }, state.voteMsg) : null,
      photosSection(c),
      ratingSection(c),
      commentsSection(c));
  }

  /* ---------- 하단 이동칸 (홈 · 마이 · 조합 만들기 · 더보기) ---------- */
  const NAV_SVG = (inner) => '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' + inner + '</svg>';
  const NAV = [
    { key: 'home', label: '홈', views: ['home', 'pick'], icon: NAV_SVG('<path d="M3.5 10.5 12 3l8.5 7.5"/><path d="M5.5 9.5V20h13V9.5"/><path d="M10 20v-5.5h4V20"/>') },
    { key: 'feed', label: '커뮤니티', views: ['feed'], icon: NAV_SVG('<path d="M5 5.5h14a1.5 1.5 0 0 1 1.5 1.5v8A1.5 1.5 0 0 1 19 16.5h-7l-4.5 3.5v-3.5H5A1.5 1.5 0 0 1 3.5 15V7A1.5 1.5 0 0 1 5 5.5z"/><path d="M8 10h8M8 13h5"/>') },
    { key: 'make', label: '조합 만들기', views: ['add'], fab: true, icon: NAV_SVG('<path d="M12 5v14M5 12h14"/>') },
    { key: 'my', label: '마이', views: ['my'], icon: NAV_SVG('<circle cx="12" cy="8" r="3.6"/><path d="M4.5 20c.8-4 3.8-6 7.5-6s6.7 2 7.5 6"/>') },
    { key: 'vote', label: '투표', views: ['vote'], icon: NAV_SVG('<rect x="4" y="6" width="16" height="12" rx="2.2"/><path d="M8 12l2.6 2.6L16 9.2"/>') }
  ];

  // 탭을 바꿀 때는 고르던 것과 열려 있던 결과를 모두 정리하고 그 탭의 첫 화면으로 가요.
  function goTab(key) {
    state.chosen = [];
    state.combo = null;
    state.auto = false;
    state.query = '';
    state.listQuery = '';
    state.expanded = false;
    state.fromList = '';

  // 날짜가 같으면 같은 결과가 나오는 간단한 난수 (하루 동안 추천이 바뀌지 않아요)
  function seededRandom(seed) {
    let t = seed >>> 0;
    return function () {
      t += 0x6D2B79F5;
      let r = Math.imul(t ^ (t >>> 15), 1 | t);
      r ^= r + Math.imul(r ^ (r >>> 7), 61 | r);
      return ((r ^ (r >>> 14)) >>> 0) / 4294967296;
    };
  }

  function todayPicks(n) {
    const d = new Date();
    const rnd = seededRandom(d.getFullYear() * 10000 + (d.getMonth() + 1) * 100 + d.getDate());
    const seen = {};
    const pool = COMBOS.filter((c) => {
      if (c.mine || seen[c.name]) return false;   // 같은 이름(여러 메인에 둔 조합)은 한 번만
      seen[c.name] = true;
      return true;
    });
    for (let i = pool.length - 1; i > 0; i--) {
      const j = Math.floor(rnd() * (i + 1));
      const t = pool[i]; pool[i] = pool[j]; pool[j] = t;
    }
    const picked = [];
    const per = {};
    pool.forEach((c) => {
      if (picked.length < n && (per[c.cat] || 0) < 2) { picked.push(c); per[c.cat] = (per[c.cat] || 0) + 1; }
    });
    pool.forEach((c) => { if (picked.length < n && picked.indexOf(c) === -1) picked.push(c); });
    return picked;
  }

  function readPhoto(file, done) {
    const fr = new FileReader();
    fr.onerror = () => done(null);
    fr.onload = () => {
      const img = new Image();
      img.onerror = () => done(null);
      img.onload = () => {
        const sc = Math.min(1, 720 / Math.max(img.width, img.height));
        const w = Math.max(1, Math.round(img.width * sc));
        const hgt = Math.max(1, Math.round(img.height * sc));
        const cv = document.createElement('canvas');
        cv.width = w;
        cv.height = hgt;
        cv.getContext('2d').drawImage(img, 0, 0, w, hgt);
        try { done(cv.toDataURL('image/jpeg', 0.72)); } catch (e) { done(null); }
      };
      img.src = fr.result;
    };
    fr.readAsDataURL(file);
  }

  function relTime(min) {
    if (min < 2) return '방금';
    if (min < 60) return Math.floor(min) + '분 전';
    if (min < 1440) return Math.floor(min / 60) + '시간 전';

  }

  function hash(str) {
    let x = 0;
    for (let i = 0; i < str.length; i++) x = (x * 31 + str.charCodeAt(i)) >>> 0;
    return x;
  }

  function savePost(d, comboName) {
    const text = d.text.trim();
    if (!text) { d.err = '한마디를 적어 주세요.'; return false; }
    const list = lsGet(KEY_POSTS, []);
    const ts = Date.now();
    list.push({ id: 'p-' + ts, nick: '나', text: text.slice(0, 100), combo: comboName, ts: ts, img: d.img || '' });
    if (!lsSet(KEY_POSTS, list)) {
      d.err = '저장 공간이 부족해요. 사진을 빼거나 예전 글을 지운 뒤 다시 올려 주세요.';
      return false;
    }
    d.err = '';
    return true;
  }

    const posts = lsGet(KEY_POSTS, []);

    COMBOS.forEach((c) => {

        old.forEach((o) => posts.push({ id: 'p-' + (o.ts || 0) + '-' + c.id, nick: '나', text: String(o.text || '').slice(0, 100), combo: c.name, ts: o.ts || Date.now(), img: '' }));
        try { localStorage.removeItem(KEY_COMMENTS + c.id); } catch (e) { /* 지우지 못해도 괜찮아요 */ }
        moved = true;
      }
    });
    if (moved) lsSet(KEY_POSTS, posts);
  }

    const sample = SAMPLE_POSTS.map((p) => Object.assign({}, p, { sample: true }));
    return mine.concat(sample);

    const c = p.combo ? comboByName(p.combo) : null;
    const hue = hash(p.nick) % 360;
    const avatar = h('span', { class: 'avatar', style: 'background:hsl(' + hue + ' 85% 92%)', 'aria-hidden': 'true' }, AVATARS[hash(p.nick) % AVATARS.length]);
    return h('article', { class: 'post' },
      h('header', { class: 'post-head' },
        avatar,
        h('span', { class: 'post-who' },
          h('b', {}, p.nick),
          h('span', { class: 'post-time' }, relTime(p.ageMin))),
        p.sample ? h('span', { class: 'opt-cat' }, '예시') : null,
        p.mine ? h('span', { class: 'opt-cat mine-tag' }, '내 글') : null,
        p.mine ? h('button', { class: 'post-del', type: 'button', onclick: () => deletePost(p.id) }, state.confirmDel === p.id ? '한 번 더 누르면 삭제' : '삭제') : null),
      h('p', { class: 'post-text' }, p.text),
      p.img ? h('img', { class: 'post-img', src: p.img, alt: '올린 사진', loading: 'lazy' }) : null,
      (p.photo && c) ? h('div', { class: 'sample-photo', 'aria-hidden': 'true' }, itemIcons(c, 3, 'mini-icons'), h('span', { class: 'opt-cat' }, '예시 사진')) : null,
      (c && !hideCombo) ? h('button', { class: 'post-combo', type: 'button', onclick: () => openCombo(c) },
        itemIcons(c, 3, 'post-icons'), h('span', { class: 'post-combo-name' }, c.name), h('span', { class: 'more-arrow', 'aria-hidden': 'true' }, '›')) : null,
      h('footer', { class: 'post-foot' },
        h('button', { class: 'like' + (liked ? ' on' : ''), type: 'button', 'aria-pressed': liked ? 'true' : 'false', onclick: () => toggleLike(p.id) },
          h('span', { 'aria-hidden': 'true' }, liked ? '♥' : '♡'), ' ' + (p.likes + (liked ? 1 : 0))),
        h('span', { class: 'cmt' }, '💬 ' + p.comments)));
  }

  function feedView() {
    const d = state.postDraft;
    const names = [];
    COMBOS.forEach((c) => { if (names.indexOf(c.name) === -1) names.push(c.name); });
    names.sort((a, b) => a.localeCompare(b, 'ko'));
    return h('section', { class: 'feed' },
      h('h1', { class: 'step-title' }, '커뮤니티'),
      h('p', { class: 'step-hint' }, '다른 사람들이 먹은 조합 이야기를 모아 봐요.'),
      h('p', { class: 'feed-note' }, '서버에 연결하기 전 미리보기예요. "예시" 표시가 있는 글은 모양을 보여 주려고 만든 샘플이고, 내가 쓴 글은 이 브라우저에만 저장돼요.'),
      h('div', { class: 'composer' },
        h('textarea', {
          id: 'post-text', class: 'field', rows: '2', maxlength: '100', placeholder: '오늘 먹은 조합은 어땠나요?', 'aria-label': '한마디 쓰기',
          oninput: (e) => { d.text = e.target.value; }
        }, d.text),
        d.img ? h('div', { class: 'photo-prev' },
          h('img', { src: d.img, alt: '첨부한 사진 미리보기' }),
          h('button', { type: 'button', 'aria-label': '사진 빼기', onclick: () => { d.img = ''; render(true); } }, '×')) : null,
        h('select', {
          id: 'post-combo', class: 'field', 'aria-label': '조합 고르기',
          onchange: (e) => { d.combo = e.target.value; }
        }, [h('option', { value: '' }, '조합 선택 안 함')].concat(names.map((n) => {
          const o = h('option', { value: n }, n);
          if (d.combo === n) o.selected = true;
          return o;
        }))),
        h('input', {
          id: 'post-photo', type: 'file', accept: 'image/*', hidden: true, 'aria-label': '사진 고르기',
          onchange: (e) => {
            const file = e.target.files && e.target.files[0];
            if (!file) return;
            readPhoto(file, (url) => {
              if (!url) d.err = '이 사진은 불러올 수 없어요. 다른 사진으로 해 보세요.';
              else { d.img = url; d.err = ''; }
              render(true);
            });
          }
        }),
        h('div', { class: 'composer-actions' },
          h('button', { class: 'btn', type: 'button', onclick: () => document.getElementById('post-photo').click() }, d.img ? '📷 사진 바꾸기' : '📷 사진 추가'),
          h('button', { class: 'btn primary', type: 'button', onclick: submitPost }, '올리기')),
        h('p', { class: 'err', role: 'alert' }, d.err || '')),
      h('div', { class: 'edit-chips', style: 'margin:14px 0 6px' },
        [['new', '최신순'], ['hot', '인기순']].map((s) => h('button', {
          class: 'edit-chip' + (state.feedSort === s[0] ? ' sel' : ''), type: 'button',
          'aria-pressed': state.feedSort === s[0] ? 'true' : 'false',
          onclick: () => { state.feedSort = s[0]; render(true); }
        }, s[1]))),
      h('div', { class: 'posts' }, allPosts().map((p) => postCard(p))));
  }

  /* ---------- 투표 (서버 연결 전 미리보기: 예시 후보 + 내 표) ---------- */
  const KEY_VOTES = 'chaltteok:votes';
  const KEY_CAND = 'chaltteok:cands';
  const WEEK_SLOTS = 3;       // 한 주에 공식 조합으로 들어오는 자리
  const VOTES_PER_WEEK = 3;   // 한 사람이 한 주에 쓸 수 있는 표
  // 모양을 보여 주기 위한 예시 후보예요. 실제 사용자가 올린 조합이 아니에요.
  const SAMPLE_CANDS = [
    { id: 'v1', name: '까르보 치즈 불닭밥', nick: '라면연구소', cat: '컵라면', items: ['까르보불닭볶음면', '즉석밥', '치즈'], votes: 214 },
    { id: 'v2', name: '우유 짜장 라면', nick: '달콤이', cat: '컵라면', items: ['공화춘 짜장', '우유', '치즈'], votes: 187 },
    { id: 'v3', name: '참치 컵누들', nick: '다이어터', cat: '컵라면', items: ['컵누들', '참치', '치즈'], votes: 163 },
    { id: 'v4', name: '김치 치즈 볶이', nick: '분식러', cat: '분식', items: ['컵 떡볶이', '김치', '체다치즈'], votes: 121 },
    { id: 'v5', name: '레몬 파워 사이다', nick: '음료왕', cat: '음료', items: ['파워에이드', '사이다', '얼음컵'], votes: 98 },
    { id: 'v6', name: '불닭 만두 쌈', nick: '쌈무사랑', cat: '컵라면', items: ['불닭볶음면', '만두', '쌈무'], votes: 77 },
    { id: 'v7', name: '요거트 바나나 볼', nick: '디저트왕', cat: '디저트', items: ['그릭 요거트', '빠다코코낫', '바나나맛우유'], votes: 61 },
    { id: 'v8', name: '치즈 오뎅 짬뽕', nick: '얼큰파', cat: '컵라면', items: ['진짬뽕', '오뎅한그릇', '치즈'], votes: 44 }
  ];
  const SAMPLE_WINNERS = [
    { id: 'w1', medal: '🥇', name: '불닭 라면볶이 치즈', nick: '라면연구소', cat: '컵라면', items: ['불닭볶음면', '콕콕콕 라면볶이', '스트링치즈'], votes: 342 },
    { id: 'w2', medal: '🥈', name: '우유 짜장 라면', nick: '달콤이', cat: '컵라면', items: ['공화춘 짜장', '우유', '치즈'], votes: 301 },
    { id: 'w3', medal: '🥉', name: '참치 김치 비빔면', nick: '시원한면', cat: '컵라면', items: ['컵누들', '참치', '김치'], votes: 276 }
  ];

  function untilNextMonday() {
    const n = new Date();
    const d = new Date(n);
    d.setHours(0, 0, 0, 0);
    d.setDate(d.getDate() + (((8 - n.getDay()) % 7) || 7));
    const ms = d - n;
    return Math.floor(ms / 86400000) + '일 ' + Math.floor((ms % 86400000) / 3600000) + '시간';
  }

  function weekCandidates() {
    const voted = lsGet(KEY_VOTES, []);
    const subs = lsGet(KEY_CAND, []);
    const mine = COMBOS.filter((c) => c.mine && subs.indexOf(c.id) !== -1)
      .map((c) => ({ id: 'm-' + c.id, name: c.name, nick: '나', cat: c.cat, items: c.items, votes: 0, mine: true, comboId: c.id }));
    return SAMPLE_CANDS.map((c) => Object.assign({ sample: true }, c)).concat(mine)
      .map((c) => Object.assign({}, c, { voted: voted.indexOf(c.id) !== -1, total: c.votes + (voted.indexOf(c.id) !== -1 ? 1 : 0) }))
      .sort((a, b) => b.total - a.total);
  }

  function toggleVote(id) {
    const voted = lsGet(KEY_VOTES, []);
    const i = voted.indexOf(id);
    state.voteMsg = '';
    if (i !== -1) voted.splice(i, 1);
    else if (voted.length >= VOTES_PER_WEEK) { state.voteMsg = '표는 한 주에 ' + VOTES_PER_WEEK + '개까지 쓸 수 있어요. 다른 표를 취소하면 다시 쓸 수 있어요.'; render(true); return; }
    else voted.push(id);
    lsSet(KEY_VOTES, voted);
    render(true);
  }

  function toggleSubmit(comboId) {
    const subs = lsGet(KEY_CAND, []);
    const i = subs.indexOf(comboId);
    if (i !== -1) subs.splice(i, 1); else subs.push(comboId);
    lsSet(KEY_CAND, subs);
    render(true);
  }

  // 예시 후보의 만드는 법도 모양을 보여 주기 위한 예시예요.
  const CAND_STEPS = {
    v1: ['까르보불닭볶음면을 조리해요.', '즉석밥을 넣고 섞어요.', '치즈를 올려 전자레인지에 1분 돌려요.'],
    v2: ['공화춘을 조리하고 물을 조금 남겨요.', '우유를 넣고 졸여요.', '치즈를 올려 녹여요.'],
    v3: ['컵누들에 물을 부어요.', '참치를 올려요.', '치즈를 올려 전자레인지에 30초 돌려요.'],
    v4: ['컵 떡볶이를 조리해요.', '김치를 올려요.', '체다치즈를 올려 전자레인지에 돌려요.'],
    v5: ['얼음컵에 파워에이드를 부어요.', '사이다를 채우고 가볍게 섞어요.'],
    v6: ['불닭볶음면을 조리해요.', '만두를 전자레인지로 익혀요.', '쌈무에 불닭볶음면과 만두를 올려 싸 먹어요.'],
    v7: ['그릭 요거트를 그릇에 담아요.', '바나나맛우유를 조금 부어요.', '빠다코코낫을 부숴 올려요.'],
    v8: ['진짬뽕에 오뎅 국물을 넣고 물을 맞춰요.', '치즈를 올려요.', '전자레인지에 2분 돌려요.'],
    w1: ['불닭볶음면과 라면볶이를 각각 조리해요.', '한 그릇에 섞어요.', '스트링치즈를 올려 전자레인지에 30초 돌려요.'],
    w2: ['공화춘을 조리하고 물을 조금 남겨요.', '우유를 넣고 졸여요.', '치즈를 올려 녹여요.'],
    w3: ['컵누들을 삶아 얼음물에 헹궈요.', '참치와 김치를 올려요.', '비빔장을 넣고 비벼요.']
  };

  // 후보를 누르면 만드는 법 화면을 열어요. (내 후보는 내가 만든 조합 그대로, 예시 후보는 예시 레시피)
  function openCand(c) {
    state.candId = c.id;
    let combo = c.comboId ? COMBOS.find((x) => x.id === c.comboId) : null;
    if (!combo) {
      combo = {
        id: 'cand-' + c.id, main: c.items[0], cat: c.cat, cand: true, name: c.name, items: c.items,
        tagline: 'by ' + c.nick, tags: [], minutes: null, steps: CAND_STEPS[c.id] || ['예시 후보라서 만드는 법이 없어요.'],
        tip: '예시 후보라서 이 만드는 법도 예시예요.', votes: 1, score: null
      };
    }
    openCombo(combo);
  }

  function candRow(c, rank) {
    const left = h('button', { class: 'cand-main', type: 'button', 'aria-label': c.name + ' 자세히 보기', onclick: () => openCand(c) },
      itemIcons({ items: c.items, cat: c.cat }, 4, 'mini-icons'),
      h('b', { class: 'cand-name' }, c.name,
        c.sample ? h('span', { class: 'opt-cat mine-tag' }, '예시') : null,
        c.mine ? h('span', { class: 'opt-cat mine-tag' }, '내 후보') : null),
      h('span', { class: 'cand-by' }, 'by ' + c.nick + ' · ' + c.items.join(' + ')));
    return h('article', { class: 'cand' + (rank <= WEEK_SLOTS ? ' in' : '') },
      h('span', { class: 'rank r' + Math.min(rank, 4) }, String(rank)),
      left,
      h('button', { class: 'vote-btn' + (c.voted ? ' on' : ''), type: 'button', 'aria-pressed': c.voted ? 'true' : 'false', onclick: () => toggleVote(c.id) },
        h('span', { 'aria-hidden': 'true' }, c.voted ? '♥' : '♡'), h('b', {}, String(c.total)), h('small', {}, c.voted ? '투표함' : '투표')));
  }

  function thisWeek() {
    const cands = weekCandidates();
    const subs = lsGet(KEY_CAND, []);
    const mineCombos = COMBOS.filter((c) => c.mine);
    const rows = [];
    cands.forEach((c, i) => {
      rows.push(candRow(c, i + 1));
      if (i + 1 === WEEK_SLOTS) rows.push(h('p', { class: 'cutline' }, '여기까지 이번 주 입성권'));
    });
    return [
      h('div', { class: 'cands' }, rows),
      h('div', { class: 'section-head' }, h('h2', { class: 'section-title' }, '내 조합을 후보로 올리기')),
      mineCombos.length
        ? h('div', {}, mineCombos.map((c) => h('div', { class: 'submit-row' },
          h('span', { class: 'cc-name' }, c.name),
          h('button', { class: 'btn' + (subs.indexOf(c.id) !== -1 ? ' on' : ''), type: 'button', onclick: () => toggleSubmit(c.id) },
            subs.indexOf(c.id) !== -1 ? '후보 취소' : '후보로 올리기'))))
        : h('p', { class: 'my-empty' }, '조합 만들기에서 만든 조합이 여기에 나타나요. 후보로 올리면 이번 주 투표에 들어가요.'),
      h('div', { class: 'actions' }, h('button', { class: 'btn', type: 'button', onclick: () => goTab('make') }, '+ 조합 만들러 가기'))
    ];
  }

  function lastWeek() {
    return [
      h('p', { class: 'form-hint', style: 'margin:0 0 10px' }, '지난주 투표 상위 3개가 공식 조합으로 들어왔어요. (예시)'),
      h('div', { class: 'cands' }, SAMPLE_WINNERS.map((w) => h('article', { class: 'cand in' },
        h('span', { class: 'medal', 'aria-hidden': 'true' }, w.medal),
        h('button', { class: 'cand-main', type: 'button', 'aria-label': w.name + ' 자세히 보기', onclick: () => openCand(w) },
          itemIcons(w, 4, 'mini-icons'),
          h('b', { class: 'cand-name' }, w.name, h('span', { class: 'opt-cat mine-tag' }, '예시')),
          h('span', { class: 'cand-by' }, 'by ' + w.nick + ' · ' + w.items.join(' + '))),
        h('span', { class: 'win-votes' }, h('b', {}, String(w.votes)), h('small', {}, '표')))))
    ];
  }

  function voteView() {
    const voted = lsGet(KEY_VOTES, []);
    return h('section', { class: 'vote' },
      h('h1', { class: 'step-title' }, '조합 투표'),
      h('p', { class: 'step-hint' }, '가장 많은 표를 받은 조합이 공식 조합으로 들어와요.'),
      h('p', { class: 'feed-note' }, '서버 연결 전 미리보기예요. "예시" 후보와 투표 수는 모양을 보여 주려고 만든 것이고, 내 표와 내 후보는 이 브라우저에만 저장돼요.'),
      h('div', { class: 'vote-banner' },
        h('span', { class: 'hero-label', style: 'color:#fff;opacity:.9' }, '이번 주 입성까지'),
        h('b', { class: 'vote-count' }, untilNextMonday()),
        h('span', { class: 'vote-sub' }, '상위 ' + WEEK_SLOTS + '개가 공식 조합에 들어와요 · 내 표 ' + voted.length + '/' + VOTES_PER_WEEK)),
      h('div', { class: 'edit-chips', style: 'margin:14px 0 10px' },
        [['week', '이번 주 후보'], ['last', '지난주 입성']].map((t) => h('button', {
          class: 'edit-chip' + (state.voteTab === t[0] ? ' sel' : ''), type: 'button', 'aria-pressed': state.voteTab === t[0] ? 'true' : 'false',
          onclick: () => { state.voteTab = t[0]; state.voteMsg = ''; render(true); }
        }, t[1]))),
      state.voteMsg ? h('p', { class: 'err', role: 'alert' }, state.voteMsg) : null,
      state.voteTab === 'last' ? lastWeek() : thisWeek());
  }

  /* ---------- 그리기 ---------- */
  function render(keepScroll) {
    // 같은 화면을 다시 그릴 때(먹어봤어요 등)는 등장 애니메이션을 다시 재생하지 않아요.
    app.classList.toggle('still', !!keepScroll);
    const v = state.view;
    const inPick = v === 'pick' && !state.combo;
    const atStart = inPick && state.chosen.length === 0;
    let body;
    if (state.combo) body = resultView();
    else if (v === 'add' && state.draft) body = addView();
    else if (v === 'list') body = listView();
    else if (v === 'my') body = myView();
    else if (v === 'more') body = moreView();
    else if (v === 'feed') body = feedView();
    else if (v === 'vote') body = voteView();
    else if (v === 'pick') body = pickView();
    else body = homeView();
    app.replaceChildren(...[
      (state.view === 'home' && !state.combo) ? null : header(),
      atStart ? catBar() : null,
      (inPick || state.combo) ? tray() : null,
      body,
      h('p', { class: 'footer-note' }, '프로토타입 · 퍼센트와 점수는 임시 값이고, 코멘트·도감·내 조합은 이 브라우저에만 저장돼요.'),
      navBar()].filter(Boolean));
    if (!keepScroll) window.scrollTo(0, 0);
  }

  loadMine();
  migrateComments();
  render(true);
})();
</script>
</body>
</html>
