<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>대본 추출기</title>
<style>
  :root { --bg:#f6f7f9; --card:#fff; --text:#1d1f23; --sub:#6b7280; --line:#e3e6ea; --accent:#2f6bff; --accent-d:#2455d1; --err:#d32f2f; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#16181c; --card:#1f2227; --text:#eceef1; --sub:#9aa1ab; --line:#30343b; --accent:#5b8cff; --accent-d:#7aa2ff; --err:#ff6b6b; }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body { background:var(--bg); color:var(--text); font:15px/1.6 -apple-system, "Apple SD Gothic Neo", sans-serif; -webkit-user-select: text; }
  main { max-width: 760px; margin: 0 auto; padding: 24px 16px 32px; min-height: 100%; display: flex; flex-direction: column; gap: 16px; }
  h1 { font-size: 22px; margin: 0; }
  .sub { color: var(--sub); margin: 2px 0 0; font-size: 14px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 16px; }
  .row { display: flex; gap: 8px; }
  input[type=text] { flex: 1; min-width: 0; padding: 11px 14px; border: 1px solid var(--line); border-radius: 10px; font-size: 15px; background: var(--bg); color: var(--text); }
  input[type=text]:focus { outline: 2px solid var(--accent); border-color: transparent; }
  button { padding: 11px 18px; border: 0; border-radius: 10px; background: var(--accent); color: #fff; font-size: 15px; font-weight: 600; cursor: pointer; white-space: nowrap; }
  button:hover { background: var(--accent-d); }
  button:disabled { opacity: .5; cursor: default; }
  button.ghost { background: transparent; color: var(--accent); border: 1px solid var(--line); }
  button.ghost:hover { background: var(--bg); }
  .opts { margin-top: 12px; font-size: 13px; color: var(--sub); display: flex; align-items: center; gap: 14px; flex-wrap: wrap; }
  .opts label { display: flex; align-items: center; gap: 6px; }
  select { padding: 4px 8px; border-radius: 6px; border: 1px solid var(--line); background: var(--bg); color: var(--text); font-size: 13px; }
  #igOpt { display: none; }
  #status { display: none; margin-top: 14px; }
  #status .top { display: flex; align-items: center; gap: 10px; color: var(--sub); font-size: 14px; }
  .spin { width: 16px; height: 16px; border: 3px solid var(--line); border-top-color: var(--accent); border-radius: 50%; animation: r 1s linear infinite; flex: none; }
  @keyframes r { to { transform: rotate(360deg); } }
  .bar { height: 6px; background: var(--line); border-radius: 3px; margin-top: 8px; overflow: hidden; display: none; }
  .bar i { display: block; height: 100%; width: 0; background: var(--accent); transition: width .4s; }
  #error { display: none; margin-top: 14px; color: var(--err); white-space: pre-wrap; word-break: break-word; font-size: 13px; }
  #result { display: none; flex: 1; flex-direction: column; min-height: 320px; }
  #title { font-size: 17px; font-weight: 700; margin: 0; }
  #meta { color: var(--sub); font-size: 13px; margin: 2px 0 12px; }
  .actions { display: flex; gap: 8px; margin-bottom: 12px; }
  textarea { flex: 1; width: 100%; min-height: 260px; padding: 14px; border: 1px solid var(--line); border-radius: 10px; font: inherit; font-size: 15px; line-height: 1.8; resize: none; background: var(--bg); color: var(--text); }
  .hint { color: var(--sub); font-size: 12px; text-align: center; }
</style>
</head>
<body>
<main>
  <div>
    <h1>대본 추출기</h1>
    <p class="sub">유튜브 · 인스타 릴스 링크를 붙여넣으면 영상 속 말을 글로 적어줍니다.</p>
  </div>

  <div class="card">
    <div class="row">
      <input id="url" type="text" placeholder="영상 링크를 여기에 붙여넣기 (⌘V)" autofocus>
      <button id="go">대본 가져오기</button>
    </div>
    <div class="opts">
      <label>정확도
        <select id="model">
          <option value="small">빠름</option>
          <option value="medium" selected>정확 (추천)</option>
          <option value="large-v3">가장 정확 (느림)</option>
        </select>
      </label>
      <label id="igOpt">인스타 로그인 정보를 가져올 브라우저
        <select id="browser">
          <option value="chrome">크롬</option>
          <option value="safari">사파리</option>
          <option value="firefox">파이어폭스</option>
          <option value="edge">엣지</option>
          <option value="brave">브레이브</option>
        </select>
      </label>
    </div>
    <div id="status">
      <div class="top"><div class="spin"></div><span id="stage"></span></div>
      <div class="bar" id="bar"><i id="fill"></i></div>
    </div>
    <div id="error"></div>
  </div>

  <div id="result" class="card">
    <h2 id="title"></h2>
    <div id="meta"></div>
    <div class="actions">
      <button id="copy">대본 복사</button>
      <button id="save" class="ghost">.txt로 저장</button>
    </div>
    <textarea id="text" readonly></textarea>
  </div>

  <p class="hint">정확도를 높일수록 처음 한 번 모델을 내려받고(빠름 0.5GB · 정확 1.5GB · 가장 정확 3GB), 받아쓰는 시간도 길어집니다.</p>
</main>

<script>
const $ = id => document.getElementById(id);
const store = {
  get(k, d) { try { return localStorage.getItem(k) || d; } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem(k, v); } catch (e) {} },
};
let api = null, current = null, polling = false;

$('model').value = store.get('model', 'medium');
$('browser').value = store.get('browser', 'chrome');
$('model').onchange = () => store.set('model', $('model').value);
$('browser').onchange = () => store.set('browser', $('browser').value);
$('url').addEventListener('input', () => {
  $('igOpt').style.display = $('url').value.includes('instagram.com') ? 'flex' : 'none';
});

window.addEventListener('pywebviewready', () => { api = window.pywebview.api; });

function setBusy(on) {
  $('go').disabled = on;
  $('status').style.display = on ? 'block' : 'none';
}

function showError(msg) {
  $('error').textContent = msg;
  $('error').style.display = 'block';
}

async function go() {
  const url = $('url').value.trim();
  if (!url || polling) return;
  if (!api) { showError('프로그램이 아직 준비 중이에요. 잠시 뒤에 다시 눌러 주세요.'); return; }
  $('error').style.display = 'none';
  $('result').style.display = 'none';
  setBusy(true);
  $('stage').textContent = '시작하는 중...';
  $('bar').style.display = 'none';
  polling = true;
  try {
    await api.start(url, $('model').value, $('browser').value);
    while (true) {
      await new Promise(r => setTimeout(r, 700));
      const job = await api.status();
      if (job.state === 'running') {
        const pct = job.ratio == null ? null : Math.round(job.ratio * 100);
        $('stage').textContent = job.stage + (pct == null ? '...' : ` ${pct}%`);
        $('bar').style.display = pct == null ? 'none' : 'block';
        if (pct != null) $('fill').style.width = pct + '%';
        continue;
      }
      if (job.state === 'error') throw new Error(job.error);
      if (job.state === 'done') {
        current = job;
        $('title').textContent = job.title || '(제목 없음)';
        $('meta').textContent = job.uploader || '';
        $('text').value = job.text;
        $('result').style.display = 'flex';
        break;
      }
    }
  } catch (e) {
    showError(e.message);
  } finally {
    polling = false;
    setBusy(false);
  }
}

$('go').onclick = go;
$('url').addEventListener('keydown', e => { if (e.key === 'Enter') go(); });

$('copy').onclick = async () => {
  let ok = false;
  try { ok = await api.copy(current.text); } catch (e) {}
  if (!ok) { $('text').select(); ok = document.execCommand('copy'); }
  $('copy').textContent = ok ? '복사됨 ✓' : '⌘C로 복사해 주세요';
  setTimeout(() => $('copy').textContent = '대본 복사', 1800);
};

$('save').onclick = async () => {
  const name = ((current.title || 'script').replace(/[\\/:*?"<>|]/g, '_').slice(0, 80)) + '.txt';
  try { await api.save(name, current.text); } catch (e) { showError(e.message); }
};
</script>
</body>
</html>
